[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workforce-ai-service"
version = "1.0.0"
description = "Standalone AI, RAG, embedding and agent runtime for AI Workforce"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "pydantic-settings==2.3.4",
  "httpx==0.28.1",
  "pypdf==5.9.0",
  "langchain==1.3.14",
  "langchain-core==1.5.3",
  "langchain-openai==1.4.2",
  "langchain-google-genai==4.3.2",
  # 1.7.0 is the last release that accepts langchain-core 1.5.x; newer ones
  # require >=1.6.3 and would drag the whole LangChain pin set forward.
  "langchain-aws==1.7.0",
  "langgraph==1.2.10",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary]>=3.2.3,<4.0",
]

[project.optional-dependencies]
huggingface = [
  "sentence-transformers>=5.1,<6.0",
  "transformers>=4.51,<5.0",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "internal_auth: exercises the X-AI-Service-Key guard itself, so the guard is not bypassed",
  "bedrock_flag: sets BEDROCK_ENABLED itself, so the suite-wide fixture leaves it alone",
  "tool_contracts: reads the backend's tool contracts itself, so the suite-wide stub is off",
]
