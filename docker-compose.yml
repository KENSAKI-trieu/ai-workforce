services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: ai_workforce_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_workforce_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: ai_workforce_ai_service
    restart: always
    env_file:
      - ./backend/.env
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8100
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-}
      BACKEND_TOOL_GATEWAY_URL: http://backend:8000
      MODEL_MEMORY_MODE: ${AI_MODEL_MEMORY_MODE:-shared}
      EMBEDDING_BACKEND: ${AI_EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL_NAME: ${AI_EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_VERSION: ${AI_EMBEDDING_VERSION:-qwen3-embedding-v1}
      EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1024}
      EMBEDDING_BATCH_SIZE: ${AI_EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_DEVICE: ${AI_EMBEDDING_DEVICE:-cuda}
      EMBEDDING_DTYPE: ${AI_EMBEDDING_DTYPE:-float16}
      EMBEDDING_CACHE_FOLDER: /models/huggingface/hub
      EMBEDDING_LOCAL_FILES_ONLY: ${AI_EMBEDDING_LOCAL_FILES_ONLY:-false}
      EMBEDDING_PRELOAD: ${AI_EMBEDDING_PRELOAD:-false}
      RERANK_BACKEND: ${AI_RERANK_BACKEND:-bge}
      RERANK_MODEL_NAME: ${AI_RERANK_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      RERANK_MODEL_PATH: ${AI_RERANK_MODEL_PATH:-}
      RERANK_DEVICE: ${AI_RERANK_DEVICE:-cuda}
      RERANK_DTYPE: ${AI_RERANK_DTYPE:-float16}
      RERANK_CACHE_FOLDER: /models/huggingface/hub
      RERANK_LOCAL_FILES_ONLY: ${AI_RERANK_LOCAL_FILES_ONLY:-false}
      RERANK_SAFETENSORS_BACKEND: ${AI_RERANK_SAFETENSORS_BACKEND:-mmap}
      RERANK_BATCH_SIZE: ${AI_RERANK_BATCH_SIZE:-2}
      RERANK_MAX_LENGTH: ${AI_RERANK_MAX_LENGTH:-2048}
      RERANK_CANDIDATE_LIMIT: ${AI_RERANK_CANDIDATE_LIMIT:-30}
      RERANK_MIN_MODEL_SCORE: ${AI_RERANK_MIN_MODEL_SCORE:-0.15}
      RERANK_MODEL_WEIGHT: ${AI_RERANK_MODEL_WEIGHT:-0.90}
      RERANK_FALLBACK_ENABLED: ${AI_RERANK_FALLBACK_ENABLED:-true}
      JINA_API_KEY: ${JINA_API_KEY:-}
      JINA_RERANK_URL: ${JINA_RERANK_URL:-https://api.jina.ai/v1/rerank}
      JINA_RERANK_MODEL: ${JINA_RERANK_MODEL:-jina-reranker-v3.5}
      JINA_RERANK_TIMEOUT_SECONDS: ${JINA_RERANK_TIMEOUT_SECONDS:-30}
      JINA_RERANK_SCORE_NORMALIZATION: ${JINA_RERANK_SCORE_NORMALIZATION:-auto}
      LANGCHAIN_ENABLED: ${LANGCHAIN_ENABLED:-false}
      LANGGRAPH_ENABLED: ${LANGGRAPH_ENABLED:-false}
      LANGGRAPH_CHECKPOINT_BACKEND: postgres
      LANGGRAPH_CHECKPOINT_AUTO_SETUP: "true"
      LANGGRAPH_STRICT_MSGPACK: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LANGCHAIN_AGENT_ROLES: ${LANGCHAIN_AGENT_ROLES:-}
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-auto}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.6-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-8}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
      AGENT_MIDDLEWARE_MODEL_RETRIES: ${AGENT_MIDDLEWARE_MODEL_RETRIES:-2}
      AGENT_COMPLEXITY_THRESHOLD: ${AGENT_COMPLEXITY_THRESHOLD:-4}
    ports:
      - "8100:8100"
    volumes:
      - hf_models:/models/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_workforce_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      # Container-specific host overrides. Credentials are loaded from backend/.env.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ""
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      AI_SERVICE_URL: http://ai-service:8100
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-}
      LANGGRAPH_ENABLED: ${LANGGRAPH_ENABLED:-false}
      LANGGRAPH_LEGACY_FALLBACK: ${LANGGRAPH_LEGACY_FALLBACK:-true}
      EMBEDDING_BACKEND: ${AI_EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL_NAME: ${AI_EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_VERSION: ${AI_EMBEDDING_VERSION:-qwen3-embedding-v1}
      EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_workforce_worker
    restart: always
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./backend/app:/app/app
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ""
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8100
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-}
      EMBEDDING_BACKEND: ${AI_EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL_NAME: ${AI_EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_VERSION: ${AI_EMBEDDING_VERSION:-qwen3-embedding-v1}
      EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from app.services.work_queue import queue_stats; assert queue_stats()['worker_online']"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_workforce_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  hf_models:
